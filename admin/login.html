<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <title>Giriş Yap | Kavruk Co. Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assets/css/vendor.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/app.min.css" rel="stylesheet" type="text/css" id="app-style" />
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="auth-bg d-flex min-vh-100 justify-content-center align-items-center">
    <div class="row g-0 justify-content-center w-100 m-3">
        <div class="col-xl-4 col-lg-5 col-md-6">
            <div class="card overflow-hidden text-center p-xxl-4 p-3 mb-0">
                <a href="../index.html" class="auth-brand mb-3">
                    <h2 class="text-primary fw-bold">KAVRUK CO.</h2>
                </a>
                <h4 class="fw-semibold mb-2">Yönetim Paneli Girişi</h4>
                <p class="text-muted mb-4">admin / admin</p>
                <div id="login-error" class="alert alert-danger d-none">Geçersiz kullanıcı adı veya şifre!</div>
                <form id="login-form" class="text-start mb-3">
                    <div class="mb-3">
                        <label class="form-label">Kullanıcı Adı</label>
                        <input type="text" id="username" class="form-control" placeholder="admin" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Şifre</label>
                        <input type="password" id="password" class="form-control" placeholder="admin" required>
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-primary" type="submit">Giriş Yap</button>
                    </div>
                </form>
                <p class="mt-auto mb-0">2026 © Kavruk Co.</p>
            </div>
        </div>
    </div>
    <script src="assets/js/vendor.min.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === 'admin' && p === 'admin') {
                sessionStorage.setItem('admin_auth', 'true');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('login-error').classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
